name: "Parity: latest releases"

# The non-blocking early warning for released-but-unpinned drift. Runs the
# latest published release of each implementation (not main tip, and not
# whatever this repo currently pins), with definitions at whatever commit that
# go-holidays release pins (see scripts/use-latest-release.sh). Do NOT make
# this a required status check: a red run here means a release has already
# shipped that breaks parity, which needs a pin bump or a fix, but it must
# never gate a PR. The nightly schedule catches a release landing while
# nothing here changes.
#
# Docs-only changes cannot affect parity, so they skip this non-blocking
# check. The pinned check has no filter: if it is a required status check, a
# filtered-out run would leave the PR waiting forever.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR supersedes its older runs, so cancel them. Runs on main
# (push, nightly, manual) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.resolve.outputs.go }}
      go_ref: ${{ steps.resolve.outputs.go_ref }}
      ruby: ${{ steps.resolve.outputs.ruby }}
      ruby_ref: ${{ steps.resolve.outputs.ruby_ref }}
      defs: ${{ steps.resolve.outputs.defs }}
      defs_sha: ${{ steps.resolve.outputs.defs_sha }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the skip step can diff against the base commit.
          fetch-depth: 0
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve-versions.sh latest
      # When nothing has been released past the pins, latest is exactly the
      # pinned versions, which the pinned workflow already tests, so skip the
      # comparison. Still run it on a manual dispatch, or when this change
      # touches the latest-release machinery itself (or the diff base is
      # unknown), since only this workflow exercises that.
      - id: skip
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GO_REF: ${{ steps.resolve.outputs.go_ref }}
          RUBY_REF: ${{ steps.resolve.outputs.ruby_ref }}
          DEFS_SHA: ${{ steps.resolve.outputs.defs_sha }}
        run: |
          pinned="$(GITHUB_OUTPUT= scripts/resolve-versions.sh pinned | grep -E '^(go_ref|ruby_ref|defs_sha)=')"
          latest="$(printf 'go_ref=%s\nruby_ref=%s\ndefs_sha=%s\n' "$GO_REF" "$RUBY_REF" "$DEFS_SHA")"
          skip=false
          if [ "$pinned" = "$latest" ] && [ "$EVENT" != workflow_dispatch ]; then
            skip=true
            if [ "$EVENT" != schedule ] && ! git diff --quiet "$BASE" HEAD -- \
              scripts/use-latest-release.sh scripts/resolve-versions.sh \
              ruby/Gemfile.latest Makefile .github/workflows/parity-latest.yml; then
              skip=false
            fi
          fi
          if [ "$skip" = true ]; then
            echo "::notice title=Latest releases match the pins::Skipping the comparison: the pinned workflow already tests these exact versions."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  latest:
    name: "Latest releases (non-blocking): Go go-holidays ${{ needs.versions.outputs.go }} = Ruby holidays ${{ needs.versions.outputs.ruby }}, definitions ${{ needs.versions.outputs.defs }}"
    needs: versions
    if: needs.versions.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # No bundler-cache: use-latest-release.sh runs `bundle install` itself
      # against ruby/Gemfile.latest, pinned to the release the versions job
      # resolved.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Compare Go and Ruby output (curated cases plus 1970-2050 sweep of every region)
        env:
          GH_TOKEN: ${{ github.token }}
          PARITY_GO: ${{ needs.versions.outputs.go }}
          PARITY_GO_REF: ${{ needs.versions.outputs.go_ref }}
          PARITY_RUBY: ${{ needs.versions.outputs.ruby }}
          PARITY_RUBY_REF: ${{ needs.versions.outputs.ruby_ref }}
          PARITY_DEFS: ${{ needs.versions.outputs.defs }}
          PARITY_DEFS_SHA: ${{ needs.versions.outputs.defs_sha }}
        run: make parity-latest
      - name: Warn that a shipped release has drifted
        if: failure()
        run: >-
          echo "::warning title=Parity against latest release::A published
          release of go-holidays or holidays disagrees with the other. Not
          blocking. See the compare step for the mismatches and the
          versions tested."
