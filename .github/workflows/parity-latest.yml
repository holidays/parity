name: "Parity: latest releases"

# The non-blocking early warning for released-but-unpinned drift. Runs the
# latest published release of each implementation (not main tip, and not
# whatever this repo currently pins), with definitions at whatever commit that
# go-holidays release pins (see scripts/use-latest-release.sh). Do NOT make
# this a required status check: a red run here means a release has already
# shipped that breaks parity, which needs a pin bump or a fix, but it must
# never gate a PR. The nightly schedule catches a release landing while
# nothing here changes.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.resolve.outputs.go }}
      go_ref: ${{ steps.resolve.outputs.go_ref }}
      ruby: ${{ steps.resolve.outputs.ruby }}
      ruby_ref: ${{ steps.resolve.outputs.ruby_ref }}
      defs: ${{ steps.resolve.outputs.defs }}
      defs_sha: ${{ steps.resolve.outputs.defs_sha }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve-versions.sh latest

  latest:
    name: "Latest releases (non-blocking): Go go-holidays ${{ needs.versions.outputs.go }} = Ruby holidays ${{ needs.versions.outputs.ruby }}, definitions ${{ needs.versions.outputs.defs }}"
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # No bundler-cache: use-latest-release.sh runs `bundle install` itself
      # against ruby/Gemfile.latest, pinned to the release the versions job
      # resolved.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Compare Go and Ruby output (curated cases plus 1970-2050 sweep of every region)
        env:
          GH_TOKEN: ${{ github.token }}
          PARITY_GO: ${{ needs.versions.outputs.go }}
          PARITY_GO_REF: ${{ needs.versions.outputs.go_ref }}
          PARITY_RUBY: ${{ needs.versions.outputs.ruby }}
          PARITY_RUBY_REF: ${{ needs.versions.outputs.ruby_ref }}
          PARITY_DEFS: ${{ needs.versions.outputs.defs }}
          PARITY_DEFS_SHA: ${{ needs.versions.outputs.defs_sha }}
        run: make parity-latest
      - name: Warn that a shipped release has drifted
        if: failure()
        run: >-
          echo "::warning title=Parity against latest release::A published
          release of go-holidays or holidays disagrees with the other. Not
          blocking. See the compare step for the mismatches and the
          versions tested."
